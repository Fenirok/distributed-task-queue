<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task Queue Dashboard</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #e3f2fd, #fce4ec);
        margin: 0;
        color: #333;
      }

      .container {
        text-align: center;
        margin-top: 40px;
      }

      h1 {
        margin-bottom: 5px;
        color: #2c3e50;
      }

      .subtitle {
        color: #555;
        margin-bottom: 25px;
      }

      .card {
        background: #ffffff;
        border-radius: 14px;
        padding: 20px;
        width: 440px;
        margin: 15px auto;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        text-align: left;
        border-left: 6px solid #4a90e2;
      }

      select,
      textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        margin-top: 6px;
      }

      button {
        margin-top: 12px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(45deg, #4a90e2, #42a5f5);
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.03);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .status-text {
        text-align: center;
        font-size: 20px;
        font-weight: 600;
      }

      .flow {
        display: flex;
        margin-top: 10px;
      }

      .step {
        flex: 1;
        margin: 5px;
        padding: 10px;
        border-radius: 10px;
        background: #eee;
        text-align: center;
        font-size: 13px;
        transition: 0.3s;
      }

      .pending.active {
        background: #ffd54f;
        color: #000;
      }
      .running.active {
        background: #4fc3f7;
        color: white;
      }
      .completed.active {
        background: #66bb6a;
        color: white;
      }
      .failed.active {
        background: #ef5350;
        color: white;
      }

      .result-box {
        margin-top: 10px;
        font-size: 13px;
        background: #f9f9f9;
        padding: 10px;
        border-radius: 8px;
      }

      .table {
        width: 100%;
        font-size: 12px;
        border-collapse: collapse;
      }

      .table th {
        background: #4a90e2;
        color: white;
      }

      .table th,
      .table td {
        padding: 8px;
      }

      .table tr:nth-child(even) {
        background: #f4f8ff;
      }

      .table tr:hover {
        background: #e3f2fd;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Task Queue Dashboard</h1>
      <p class="subtitle">Real-time asynchronous processing visualization</p>

      <!-- NEW: 3 TASK CARDS -->
      <div
        style="
          display: flex;
          gap: 20px;
          justify-content: center;
          flex-wrap: wrap;
        "
      >
        <!-- CARD 1 -->
        <div class="card">
          <label>Task Type</label>
          <select id="taskType1">
            <option value="email_send">Email</option>
            <option value="csv_process">CSV</option>
            <option value="report_generation">Report</option>
          </select>

          <label>Payload</label>
          <textarea id="payload1" rows="5">
{
  "to": "demo@gmail.com",
  "subject": "Hello",
  "body": "Test email"
}
          </textarea>

          <button onclick="createTask(1)">Run Task</button>

          <div class="status-text" id="status1">Idle</div>

          <div class="flow">
            <div id="pending1" class="step">Pending</div>
            <div id="running1" class="step">Running</div>
            <div id="completed1" class="step">Completed</div>
          </div>
        </div>

        <!-- CARD 2 -->
        <div class="card">
          <label>Task Type</label>
          <select id="taskType2">
            <option value="email_send">Email</option>
            <option value="csv_process">CSV</option>
            <option value="report_generation">Report</option>
          </select>

          <textarea id="payload2" rows="5">
{
  "fileName": "data.csv",
  "rows": 100
}
          </textarea>

          <button onclick="createTask(2)">Run Task</button>

          <div class="status-text" id="status2">Idle</div>

          <div class="flow">
            <div id="pending2" class="step">Pending</div>
            <div id="running2" class="step">Running</div>
            <div id="completed2" class="step">Completed</div>
          </div>
        </div>

        <!-- CARD 3 -->
        <div class="card">
          <label>Task Type</label>
          <select id="taskType3">
            <option value="email_send">Email</option>
            <option value="csv_process">CSV</option>
            <option value="report_generation">Report</option>
          </select>

          <textarea id="payload3" rows="5">
{
  "reportType": "sales",
  "date": "2026-03-29"
}
          </textarea>

          <button onclick="createTask(3)">Run Task</button>

          <div class="status-text" id="status3">Idle</div>

          <div class="flow">
            <div id="pending3" class="step">Pending</div>
            <div id="running3" class="step">Running</div>
            <div id="completed3" class="step">Completed</div>
          </div>
        </div>
      </div>

      <!-- EXISTING STATUS CARD (UNCHANGED) -->
      <div class="card" style="border-left-color: #66bb6a">
        <div class="status-text" id="status">Idle</div>

        <div class="flow">
          <div id="pending" class="step">Pending</div>
          <div id="running" class="step">Running</div>
          <div id="completed" class="step">Completed</div>
        </div>

        <div class="result-box">
          <div><b>Task ID:</b> <span id="taskId">-</span></div>
          <div>
            <b>Result:</b>
            <span id="result" style="color: green; font-weight: 600">-</span>
          </div>
          <div>
            <b>Error:</b>
            <span id="error" style="color: red; font-weight: 600">-</span>
          </div>
        </div>
      </div>

      <!-- EXISTING TABLE (UNCHANGED) -->
      <div class="card" style="border-left-color: #ab47bc">
        <label>Filter Tasks</label>
        <select id="filterStatus" onchange="loadTasks()">
          <option value="">All</option>
          <option value="PENDING">Pending</option>
          <option value="RUNNING">Running</option>
          <option value="COMPLETED">Completed</option>
          <option value="FAILED">Failed</option>
        </select>

        <table class="table" id="taskTable">
          <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Status</th>
          </tr>
        </table>
      </div>
    </div>

    <script>
      const taskMap = {};

      function resetSteps(card) {
        ["pending", "running", "completed"].forEach((s) => {
          document.getElementById(s + card).className = "step";
        });
      }

      function setStep(card, status) {
        resetSteps(card);

        if (status === "PENDING") {
          document
            .getElementById("pending" + card)
            .classList.add("active", "pending");
        }
        if (status === "RUNNING") {
          document
            .getElementById("pending" + card)
            .classList.add("active", "pending");
          document
            .getElementById("running" + card)
            .classList.add("active", "running");
        }
        if (status === "COMPLETED") {
          document
            .getElementById("pending" + card)
            .classList.add("active", "pending");
          document
            .getElementById("running" + card)
            .classList.add("active", "running");
          document
            .getElementById("completed" + card)
            .classList.add("active", "completed");
        }
        if (status === "FAILED") {
          document
            .getElementById("completed" + card)
            .classList.add("active", "failed");
        }
      }

      async function createTask(card) {
        const type = document.getElementById("taskType" + card).value;
        const payload = JSON.parse(
          document.getElementById("payload" + card).value,
        );

        document.getElementById("status" + card).innerText = "Submitting...";
        resetSteps(card);

        const res = await fetch("/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskType: type, payload: payload }),
        });

        const data = await res.json();
        taskMap[card] = data.task_id;

        pollStatus(card);
      }

      function pollStatus(card) {
        const interval = setInterval(async () => {
          const res = await fetch(`/tasks/${taskMap[card]}`);
          const task = await res.json();

          
          document.getElementById("status" + card).innerText = task.status;
          setStep(card, task.status);

         
          document.getElementById("status").innerText = task.status;
          document.getElementById("taskId").innerText = task.id;
          //document.getElementById("result").innerText = task.result || "-";
          //document.getElementById("error").innerText = task.error || "-";

          const resultEl = document.getElementById("result");
          const errorEl = document.getElementById("error");

          if (task.status === "COMPLETED") {
            resultEl.innerText = task.result || "Success";
            resultEl.style.color = "green";
            errorEl.innerText = "-";
          }

          if (task.status === "FAILED") {
            errorEl.innerText = task.error || "Error occurred";
            errorEl.style.color = "red";
            resultEl.innerText = "-";
          }

        
          setGlobalStep(task.status);

          
          loadTasks();

          if (task.status === "COMPLETED" || task.status === "FAILED") {
            clearInterval(interval);
          }
        }, 1000);
      }

      function setGlobalStep(status) {
        ["pending", "running", "completed"].forEach((id) => {
          document.getElementById(id).className = "step";
        });

        if (status === "PENDING") {
          document.getElementById("pending").classList.add("active", "pending");
        }

        if (status === "RUNNING") {
          document.getElementById("pending").classList.add("active", "pending");
          document.getElementById("running").classList.add("active", "running");
        }

        if (status === "COMPLETED") {
          document.getElementById("pending").classList.add("active", "pending");
          document.getElementById("running").classList.add("active", "running");
          document
            .getElementById("completed")
            .classList.add("active", "completed");
        }

        if (status === "FAILED") {
          document
            .getElementById("completed")
            .classList.add("active", "failed");
        }
      }

      async function loadTasks() {
        let url = "/tasks";
        const status = document.getElementById("filterStatus").value;
        if (status) url += "?status=" + status;

        const res = await fetch(url);
        const tasks = await res.json();

        let html = `<tr><th>ID</th><th>Type</th><th>Status</th></tr>`;

        tasks.forEach((t) => {
          html += `<tr>
            <td>${t.id.substring(0, 8)}...</td>
            <td>${t.taskType}</td>
            <td>${t.status}</td>
          </tr>`;
        });

        document.getElementById("taskTable").innerHTML = html;
      }

      loadTasks();
    </script>
  </body>
</html>
